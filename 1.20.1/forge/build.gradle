plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('forge.enabledGameTestNamespaces', mod_id)
            ideName = "Forge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
        }
        // QA client: opens the "qa" save straight away (see tools/qa/client_boot.sh).
        qaClient {
            client()
            gameDirectory = project.file('runs/client')
            programArguments.addAll '--quickPlaySingleplayer', 'qa', '--width', '1600', '--height', '900'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('build/gametest')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // @Nullable in the common code; Forge's userdev does not bring it (the common project gets it from mcp_config).
    compileOnly 'org.jetbrains:annotations:24.0.1'
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
}

jar {
    finalizedBy('reobfJar')
}
